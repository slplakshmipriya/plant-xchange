# GardenSwap API — Cloud Build: build image, push to Artifact Registry, deploy to Cloud Run.
# Trigger: push to develop/main (path filter: api/**).
# Substitutions: _REGION (default us-central1), _SERVICE (default gardenswap-api).
# Secrets (DATABASE_URL, FIREBASE_*) are attached via Secret Manager at deploy
# time — never baked into the image or this file. See api/docs/secrets.md.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/gardenswap/api:$SHORT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/gardenswap/api:latest'
      - 'api'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/gardenswap/api'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/gardenswap/api:$SHORT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--set-secrets=DATABASE_URL=gardenswap-database-url:latest'
      - '--set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=gardenswap-firebase-sa:latest'
substitutions:
  _REGION: 'us-central1'
  _SERVICE: 'gardenswap-api'
options:
  logging: CLOUD_LOGGING_ONLY
