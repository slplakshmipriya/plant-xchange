            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Me Me Get
      security:
      - bearerAuth: []
components:
  schemas:
    AttachmentIn:
      properties:
        photoUrl:
          type: string
          maxLength: 2000
          minLength: 1
          title: Photourl
      type: object
      required:
      - photoUrl
      title: AttachmentIn
    ConfirmIn:
      properties:
        listing_id:
          type: string
          minLength: 1
          title: Listing Id
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Idempotency Key
      type: object
      required:
      - listing_id
      title: ConfirmIn
    FcmTokenIn:
      properties:
        token:
          type: string
          maxLength: 4096
          minLength: 1
          title: Token
        platform:
          type: string
          maxLength: 32
          title: Platform
          default: android
      type: object
      required:
      - token
      title: FcmTokenIn
    FinalizeIn:
      properties:
        key:
          type: string
          title: Key
      type: object
      required:
      - key
      title: FinalizeIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HarvestEventIn:
      properties:
        listing_id:
          type: string
          minLength: 1
          title: Listing Id
        delta_kg:
          type: number
          maximum: 10000.0
          exclusiveMinimum: 0.0
          title: Delta Kg
      type: object
      required:
      - listing_id
      - delta_kg
      title: HarvestEventIn
    ListingIn:
      properties:
        type:
          type: string
          pattern: ^(seedling|harvest|tree)$
          title: Type
        photos:
          items:
            type: string
          type: array
          minItems: 1
          title: Photos
        variety:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Variety
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Quantity
        unit:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Unit
        credit_cost:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Credit Cost
        pickup_window:
          anyOf:
          - $ref: '#/components/schemas/PickupWindow'
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        geo_lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Geo Lat
        geo_lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Geo Lon
        spray_disclosure:
          type: string
          maxLength: 2000
          minLength: 1
          title: Spray Disclosure
        status:
          type: string
          pattern: ^(draft|live)$
          title: Status
          default: draft
        visit_rules:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Visit Rules
        potSize:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Potsize
        plantAgeYears:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Plantageyears
        pickupWindowDays:
          type: integer
          maximum: 14.0
          minimum: 1.0
          title: Pickupwindowdays
          default: 4
      type: object
      required:
      - type
      - photos
      - credit_cost
      - spray_disclosure
      title: ListingIn
    ListingPatch:
      properties:
        photos:
          anyOf:
          - items:
              type: string
            type: array
            minItems: 1
          - type: 'null'
          title: Photos
        variety:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Variety
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Quantity
        unit:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Unit
        credit_cost:
          anyOf:
          - type: integer
            maximum: 3.0
            minimum: 1.0
          - type: 'null'
          title: Credit Cost
        pickup_window:
          anyOf:
          - $ref: '#/components/schemas/PickupWindow'
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        spray_disclosure:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Spray Disclosure
        status:
          anyOf:
          - type: string
            pattern: ^(draft|live|claimed|completed|cancelled)$
          - type: 'null'
          title: Status
        visit_rules:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Visit Rules
      type: object
      title: ListingPatch
    MessageIn:
      properties:
        body:
          type: string
          maxLength: 2000
          minLength: 1
          title: Body
      type: object
      required:
      - body
      title: MessageIn
    OwnerProfile:
      properties:
        uid:
          type: string
          title: Uid
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        idv_status:
          type: string
          title: Idv Status
          default: unverified
        home_zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Home Zip
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - uid
      - display_name
      - avatar_url
      - home_zip
      title: OwnerProfile
    PickupWindow:
      properties:
        start:
          type: string
          format: date-time
          title: Start
        end:
          type: string
          format: date-time
          title: End
      type: object
      required:
      - start
      - end
      title: PickupWindow
    PrefsIn:
      properties:
        categories:
          additionalProperties:
            type: boolean
          type: object
          title: Categories
        quiet_hours:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Quiet Hours
        quietHours:
          anyOf:
          - $ref: '#/components/schemas/QuietHoursWindow'
          - type: 'null'
      type: object
      title: PrefsIn
      description: 'PUT body. ``categories`` REPLACES the stored map (absent categories

        default to opted-in at send time). ``quiet_hours`` is the legacy

        snake_case toggle; ``quietHours`` is the new window object — an explicit

        ``null`` disables quiet hours, an object enables them with that window.

        When both are present, ``quietHours`` wins.'
    ProfileIn:
      properties:
        display_name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Avatar Url
        home_zip:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Home Zip
      type: object
      title: ProfileIn
    PublicProfile:
      properties:
        uid:
          type: string
          title: Uid
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        idv_status:
          type: string
          title: Idv Status
          default: unverified
      type: object
      required:
      - uid
      - display_name
      - avatar_url
      title: PublicProfile
    QuietHoursWindow:
      properties:
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          title: Start
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          title: End
      type: object
      required:
      - start
      - end
      title: QuietHoursWindow
    ReviewIn:
      properties:
        rating:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Rating
        comment:
          type: string
          maxLength: 2000
          title: Comment
          default: ''
      type: object
      required:
      - rating
      title: ReviewIn
    SignIn:
      properties:
        content_type:
          type: string
          title: Content Type
        size_bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Size Bytes
      type: object
      required:
      - content_type
      - size_bytes
      title: SignIn
    SitterProfileIn:
      properties:
        bio:
          type: string
          maxLength: 2000
          title: Bio
          default: ''
        experience_years:
          type: integer
          maximum: 60.0
          minimum: 0.0
          title: Experience Years
          default: 0
        service_radius_miles:
          type: number
          maximum: 100.0
          exclusiveMinimum: 0.0
          title: Service Radius Miles
          default: 5
        active:
          type: boolean
          title: Active
          default: true
      type: object
      title: SitterProfileIn
    SittingRequestIn:
      properties:
        sitter_uid:
          type: string
          minLength: 1
          title: Sitter Uid
        plant_count:
          type: integer
          maximum: 500.0
          exclusiveMinimum: 0.0
          title: Plant Count
        start_date:
          type: string
          maxLength: 10
          minLength: 10
          title: Start Date
        end_date:
          type: string
          maxLength: 10
          minLength: 10
          title: End Date
        notes:
          type: string
          maxLength: 2000
          title: Notes
          default: ''
      type: object
      required:
      - sitter_uid
      - plant_count
      - start_date
      - end_date
      title: SittingRequestIn
    StubDecision:
      properties:
        decision:
          type: string
          pattern: ^(approved|rejected)$
          title: Decision
      type: object
      required:
      - decision
      title: StubDecision
    ThreadIn:
      properties:
        listing_id:
          type: string
          minLength: 1
          title: Listing Id
      type: object
      required:
      - listing_id
      title: ThreadIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WantIn:
      properties:
        variety:
          type: string
          maxLength: 120
          minLength: 1
          title: Variety
        types:
          items:
            type: string
          type: array
          maxItems: 3
          title: Types
      type: object
      required:
      - variety
      title: WantIn
    WantPatch:
      properties:
        variety:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Variety
        types:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 3
          - type: 'null'
          title: Types
      type: object
      title: WantPatch
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token. Required on every route except /healthz and
        /openapi.yaml.
