openapi: 3.1.0
info:
  title: GardenSwap API
  description: 'Hyperlocal gardening exchange: seedling swaps, harvest swaps, pick-your-own
    slots, plant sitting, and a fungible credit economy.'
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Healthz
      description: Liveness probe. Auth-exempt; must stay cheap and dependency-free.
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /v1/users:
    post:
      tags:
      - users
      summary: Upsert Profile
      description: Create or update the caller's own profile. uid comes from the ID
        token.
      operationId: upsert_profile_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/me:
    get:
      tags:
      - users
      summary: Get Me
      operationId: get_me_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
      security:
      - bearerAuth: []
    patch:
      tags:
      - users
      summary: Patch Me
      operationId: patch_me_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/{uid}:
    get:
      tags:
      - users
      summary: Get Public Profile
      description: Anyone authenticated can see the public profile — no PII, no home_zip.
      operationId: get_public_profile_v1_users__uid__get
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          title: Uid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/auth/verify:
    post:
      tags:
      - auth
      summary: Verify Phone
      operationId: verify_phone_v1_auth_verify_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Verify Phone V1 Auth Verify Post
      security:
      - bearerAuth: []
  /me:
    get:
      tags:
      - auth
      summary: Me
      description: 'Whoami: proves the caller''s ID token verified. Used by clients
        at login.'
      operationId: me_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Me Me Get
      security:
      - bearerAuth: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OwnerProfile:
      properties:
        uid:
          type: string
          title: Uid
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        idv_status:
          type: string
          title: Idv Status
          default: unverified
        home_zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Home Zip
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - uid
      - display_name
      - avatar_url
      - home_zip
      title: OwnerProfile
    ProfileIn:
      properties:
        display_name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Avatar Url
        home_zip:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Home Zip
      type: object
      title: ProfileIn
    PublicProfile:
      properties:
        uid:
          type: string
          title: Uid
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        idv_status:
          type: string
          title: Idv Status
          default: unverified
      type: object
      required:
      - uid
      - display_name
      - avatar_url
      title: PublicProfile
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token. Required on every route except /healthz and
        /openapi.yaml.
