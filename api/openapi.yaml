openapi: 3.1.0
info:
  title: GardenSwap API
  description: 'Hyperlocal gardening exchange: seedling swaps, harvest swaps, pick-your-own
    slots, plant sitting, and a fungible credit economy.'
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Healthz
      description: Liveness probe. Auth-exempt; must stay cheap and dependency-free.
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /v1/users:
    post:
      tags:
      - users
      summary: Upsert Profile
      description: Create or update the caller's own profile. uid comes from the ID
        token.
      operationId: upsert_profile_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/me:
    get:
      tags:
      - users
      summary: Get Me
      operationId: get_me_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
      security:
      - bearerAuth: []
    patch:
      tags:
      - users
      summary: Patch Me
      operationId: patch_me_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/{uid}:
    get:
      tags:
      - users
      summary: Get Public Profile
      description: Anyone authenticated can see the public profile — no PII, no home_zip.
      operationId: get_public_profile_v1_users__uid__get
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          title: Uid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/auth/verify:
    post:
      tags:
      - auth
      summary: Verify Phone
      operationId: verify_phone_v1_auth_verify_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Verify Phone V1 Auth Verify Post
      security:
      - bearerAuth: []
  /v1/idv/session:
    post:
      tags:
      - idv
      summary: Create Session
      operationId: create_session_v1_idv_session_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Session V1 Idv Session Post
      security:
      - bearerAuth: []
  /v1/idv/webhook:
    post:
      tags:
      - idv
      summary: Idv Webhook
      description: Auth-exempt (no user token possible); secured by HMAC signature
        only.
      operationId: idv_webhook_v1_idv_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Idv Webhook V1 Idv Webhook Post
  /v1/idv/stub/decide:
    post:
      tags:
      - idv
      summary: Stub Decide
      description: 'TEST-ONLY: acts as the stub vendor delivering a signed verdict
        webhook.'
      operationId: stub_decide_v1_idv_stub_decide_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StubDecision'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Stub Decide V1 Idv Stub Decide Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings:
    post:
      tags:
      - listings
      summary: Create Listing
      operationId: create_listing_v1_listings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Listing V1 Listings Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings/{listing_id}:
    get:
      tags:
      - listings
      summary: Get Listing
      operationId: get_listing_v1_listings__listing_id__get
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Listing V1 Listings  Listing Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
    patch:
      tags:
      - listings
      summary: Patch Listing
      operationId: patch_listing_v1_listings__listing_id__patch
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patch Listing V1 Listings  Listing Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings/{listing_id}/cancel:
    post:
      tags:
      - listings
      summary: Cancel Listing
      operationId: cancel_listing_v1_listings__listing_id__cancel_post
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Cancel Listing V1 Listings  Listing Id  Cancel Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/harvest-events:
    post:
      tags:
      - listings
      - listings
      summary: Record Harvest Event
      description: 'Record kilos picked from a harvest listing (owner only, live only).


        Atomic decrement — concurrent pickers cannot oversell. When the harvest

        is fully picked (remaining hits 0) the listing completes via the legal

        live -> claimed -> completed path.'
      operationId: record_harvest_event_v1_harvest_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestEventIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Record Harvest Event V1 Harvest Events Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings/{listing_id}/harvest-events:
    get:
      tags:
      - listings
      - listings
      summary: Get Harvest Events
      description: Pick audit log for a harvest listing. Owner and authenticated viewers.
      operationId: get_harvest_events_v1_listings__listing_id__harvest_events_get
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Harvest Events V1 Listings  Listing Id  Harvest
                  Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/trees/{listing_id}/ripe-alert:
    post:
      tags:
      - listings
      - trees
      summary: Ripe Alert
      description: 'Notify want-list matches that a tree is ripe for picking (API-050).


        Owner-only. The notify layer''s 24h dedupe on ref ``<listing>:<date>``

        makes this safe to re-trigger — each user gets at most one ripe alert

        per tree per day.'
      operationId: ripe_alert_v1_trees__listing_id__ripe_alert_post
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ripe Alert V1 Trees  Listing Id  Ripe Alert Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/internal/sweep:
    post:
      tags:
      - internal
      summary: Sweep Expired
      description: 'Idempotent expiry job. Auth: shared secret header (NOT a user
        token).'
      operationId: sweep_expired_v1_internal_sweep_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Sweep Expired V1 Internal Sweep Post
  /v1/uploads/sign:
    post:
      tags:
      - uploads
      summary: Sign Upload
      operationId: sign_upload_v1_uploads_sign_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Sign Upload V1 Uploads Sign Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/uploads/raw/{key}:
    put:
      tags:
      - uploads
      summary: Put Raw
      description: 'Local-stub raw PUT target. (GCS backend: 501 — clients PUT to
        the signed URL.)'
      operationId: put_raw_v1_uploads_raw__key__put
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Put Raw V1 Uploads Raw  Key  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/uploads/finalize:
    post:
      tags:
      - uploads
      summary: Finalize Upload
      operationId: finalize_upload_v1_uploads_finalize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Finalize Upload V1 Uploads Finalize Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/me/notification-prefs:
    get:
      tags:
      - notifications
      summary: Get Notification Prefs
      operationId: get_notification_prefs_v1_users_me_notification_prefs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Notification Prefs V1 Users Me Notification Prefs
                  Get
      security:
      - bearerAuth: []
    put:
      tags:
      - notifications
      summary: Put Notification Prefs
      operationId: put_notification_prefs_v1_users_me_notification_prefs_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrefsIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Put Notification Prefs V1 Users Me Notification Prefs
                  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/feed:
    get:
      tags:
      - feed
      summary: Get Feed
      description: Ranked discovery feed of live listings (fuzzed geo, no PII).
      operationId: get_feed_v1_feed_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Feed V1 Feed Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/want-list:
    get:
      tags:
      - want-list
      summary: List Wants
      operationId: list_wants_v1_want_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Wants V1 Want List Get
      security:
      - bearerAuth: []
    post:
      tags:
      - want-list
      summary: Create Want
      operationId: create_want_v1_want_list_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WantIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Want V1 Want List Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/want-list/{want_id}:
    patch:
      tags:
      - want-list
      summary: Patch Want
      operationId: patch_want_v1_want_list__want_id__patch
      parameters:
      - name: want_id
        in: path
        required: true
        schema:
          type: string
          title: Want Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WantPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patch Want V1 Want List  Want Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
    delete:
      tags:
      - want-list
      summary: Delete Want
      operationId: delete_want_v1_want_list__want_id__delete
      parameters:
      - name: want_id
        in: path
        required: true
        schema:
          type: string
          title: Want Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /me:
    get:
      tags:
      - auth
      summary: Me
      description: 'Whoami: proves the caller''s ID token verified. Used by clients
        at login.'
      operationId: me_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Me Me Get
      security:
      - bearerAuth: []
components:
  schemas:
    FinalizeIn:
      properties:
        key:
          type: string
          title: Key
      type: object
      required:
      - key
      title: FinalizeIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HarvestEventIn:
      properties:
        listing_id:
          type: string
          minLength: 1
          title: Listing Id
        delta_kg:
          type: number
          maximum: 10000.0
          exclusiveMinimum: 0.0
          title: Delta Kg
      type: object
      required:
      - listing_id
      - delta_kg
      title: HarvestEventIn
    ListingIn:
      properties:
        type:
          type: string
          pattern: ^(seedling|harvest|tree)$
          title: Type
        photos:
          items:
            type: string
          type: array
          minItems: 1
          title: Photos
        variety:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Variety
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Quantity
        unit:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Unit
        credit_cost:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Credit Cost
        pickup_window:
          anyOf:
          - $ref: '#/components/schemas/PickupWindow'
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        geo_lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Geo Lat
        geo_lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Geo Lon
        spray_disclosure:
          type: string
          maxLength: 2000
          minLength: 1
          title: Spray Disclosure
        status:
          type: string
          pattern: ^(draft|live)$
          title: Status
          default: draft
        visit_rules:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Visit Rules
      type: object
      required:
      - type
      - photos
      - credit_cost
      - spray_disclosure
      title: ListingIn
    ListingPatch:
      properties:
        photos:
          anyOf:
          - items:
              type: string
            type: array
            minItems: 1
          - type: 'null'
          title: Photos
        variety:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Variety
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Quantity
        unit:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Unit
        credit_cost:
          anyOf:
          - type: integer
            maximum: 3.0
            minimum: 1.0
          - type: 'null'
          title: Credit Cost
        pickup_window:
          anyOf:
          - $ref: '#/components/schemas/PickupWindow'
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        spray_disclosure:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Spray Disclosure
        status:
          anyOf:
          - type: string
            pattern: ^(draft|live|claimed|completed|cancelled)$
          - type: 'null'
          title: Status
        visit_rules:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Visit Rules
      type: object
      title: ListingPatch
    OwnerProfile:
      properties:
        uid:
          type: string
          title: Uid
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        idv_status:
          type: string
          title: Idv Status
          default: unverified
        home_zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Home Zip
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - uid
      - display_name
      - avatar_url
      - home_zip
      title: OwnerProfile
    PickupWindow:
      properties:
        start:
          type: string
          format: date-time
          title: Start
        end:
          type: string
          format: date-time
          title: End
      type: object
      required:
      - start
      - end
      title: PickupWindow
    PrefsIn:
      properties:
        categories:
          additionalProperties:
            type: boolean
          type: object
          title: Categories
        quiet_hours:
          type: boolean
          title: Quiet Hours
          default: true
      type: object
      title: PrefsIn
    ProfileIn:
      properties:
        display_name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Avatar Url
        home_zip:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Home Zip
      type: object
      title: ProfileIn
    PublicProfile:
      properties:
        uid:
          type: string
          title: Uid
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        idv_status:
          type: string
          title: Idv Status
          default: unverified
      type: object
      required:
      - uid
      - display_name
      - avatar_url
      title: PublicProfile
    SignIn:
      properties:
        content_type:
          type: string
          title: Content Type
        size_bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Size Bytes
      type: object
      required:
      - content_type
      - size_bytes
      title: SignIn
    StubDecision:
      properties:
        decision:
          type: string
          pattern: ^(approved|rejected)$
          title: Decision
