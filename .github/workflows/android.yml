# Android CI (SEC-002). Builds the debug APK and runs the JVM regression suite
# on every PR/push touching android/, plus a weekly scheduled run that
# validates the base branch after Dependabot's weekly updates land.
#
# NOTE (SEC-002): a dedicated vulnerability scanner (e.g. OWASP
# Dependency-Check) is intentionally NOT wired here — it cannot run in this
# environment and would be dead config. Dependency updates are handled by
# Dependabot (.github/dependabot.yml, weekly); each update PR runs this
# workflow. Add the scanner once a dev machine/CI runner can execute it.
name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # CI has no real google-services.json (git-ignored, see
      # android/docs/firebase-setup.md). Write a placeholder with the correct
      # package name so processDebugGoogleServices passes. Keys are fake;
      # push delivery is NOT tested in CI.
      - name: CI placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "garden-swap-ci",
              "storage_bucket": "garden-swap-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.gardenswap.app" }
                },
                "api_key": [{ "current_key": "CI_PLACEHOLDER_NOT_A_REAL_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
