# GardenSwap API CI (SEC-002). Runs on every push/PR touching api/**.
name: api

on:
  push:
    paths: ['api/**', '.github/workflows/api.yml', '.gitleaks.toml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml', '.gitleaks.toml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Run pytest
        working-directory: api
        run: python -m pytest -q

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit==2.9.0
      - name: Audit dependencies (fail on any known vulnerability)
        # pip-audit's JSON output carries no severity ratings, so a
        # HIGH/CRITICAL-only filter is not implementable from its output.
        # The gate fails on ANY known vulnerability instead (strictly stronger);
        # triage accepted-risk items in IGNORED with reason + owner + date.
        run: |
          pip-audit --requirement api/requirements.txt --format=json --output=audit.json || true
          python - <<'EOF'
          import json, sys
          report = json.load(open("audit.json"))
          IGNORED = {
              # "PYSEC-0000-000": "reason; owner; 2026-09-27",
          }
          bad = []
          for dep in report.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  vid = vuln["id"]
                  if vid in IGNORED:
                      print(f"ignoring {vid} ({dep['name']}): {IGNORED[vid]}")
                      continue
                  fixes = ", ".join(vuln.get("fix_versions", [])) or "no fix listed"
                  bad.append(f"{vid} in {dep['name']} {dep['version']} (fix: {fixes})")
          if bad:
              print("Failing: known vulnerabilities in pinned dependencies:")
              print("\n".join(f"  - {b}" for b in bad))
              print("Triage: upgrade the package, or add the ID to IGNORED with reason/owner/date.")
              sys.exit(1)
          print("No known vulnerabilities found.")
          EOF

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
